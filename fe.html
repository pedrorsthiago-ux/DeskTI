<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DeskTI - Central de Atendimento</title>

    <link rel="stylesheet" href="fe.css">
</head>

<body>

    <div class="container">
        <div class="header">
            <h1>DeskTI</h1>
            <p>Central de Atendimento Técnico</p>
            <p>Departamento de Tecnologia da Informação - DSTI</p>
        </div>

        <form id="formulario">

            <div class="form-group">
                <label for="solicitacao">Tipo de solicitação</label>

                <select id="solicitacao" required>
                    <option value="">Selecione uma opção</option>
                    <option value="Reserva de equipamentos">
                        Reserva de equipamentos
                    </option>
                    <option value="Relatar problema com equipamento">
                        Relatar problema com equipamento
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label for="equipamento">
                    Equipamento relacionado
                </label>

                <input type="text" id="equipamento"
                placeholder="Ex.: Computador, notebook, projetor..."
                required>
            </div>

            <div class="form-group">
                <label for="descricao">
                    Descrição da solicitação
                </label>

                <textarea id="descricao"
                placeholder="Descreva sua solicitação ou relate o problema..."
                required></textarea>
            </div>

            <button type="submit">Enviar solicitação</button>

        </form>

        <div class="footer">
            DeskTI © 2026 | DSTI
            <p>Central exclusiva para demandas técnicas de TI.</p>
        </div>

    </div>

    <script src="fe.js"></script>
</body>
</html>
